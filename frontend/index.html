<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#165DFF" />
    <link rel="icon" href="/img/anonymous-user.png" />
    <title>Sparkle BTN</title>
  </head>
  <body>
    <script>
      (() => {
        let mode = 'system'
        try { mode = localStorage.getItem('sparkle:theme') || 'system' } catch {}
        const dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.body.setAttribute('arco-theme', 'dark')
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
